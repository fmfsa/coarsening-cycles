# GroupLiNGAM vs ours over sample size (scripts/run_group_lingam.sh).
# Time limits are ceilings, not runtime predictions; both methods get the same
# limit at a given n. Freeze this file before launching and keep it with the outputs.
group_lingam:
  sizes: [100, 500, 1000, 2000, 5000, 10000]
  seeds: 10
  # GroupLiNGAM is fitted only for n <= this; ours runs on every size.
  # Median GroupLiNGAM fit alone: ~6 s (n=100), ~77 s (500), ~285 s (1000),
  # ~27 min (2000); n=5000 took ~11 h with 4 concurrent fits.
  group_lingam_max_n: 5000
  # Concurrent single-threaded timed fits. Contention inflates GroupLiNGAM
  # times (8 concurrent fits: ~3.6x slower at n=1000), so 1 is the clean protocol.
  parallel_fits: 1
  timeout_by_n:
    100: 600
    500: 600
    1000: 1800
    2000: 7200
    5000: 86400
    10000: 86400
