# Full paired comparison. Time limits are ceilings, not runtime predictions.
# Freeze this file before running; retain it with the outputs.
group_lingam_full:
  sizes: [100, 500, 1000, 2000, 5000, 10000]
  seeds: 10
  # GroupLiNGAM is fitted only for n <= this; ours runs on every size.
  # A serial n=2000 fit took ~28 min on the server; n=10000 would need ~1 day per fit.
  group_lingam_max_n: 1000
  # Concurrent single-threaded timed fits. 8 slots slowed GroupLiNGAM ~3.6x
  # (serial n=1000 seed 2: 278 s vs 996 s), so the paper run is serial.
  parallel_fits: 1
  timeout_by_n:
    100: 600
    500: 600
    1000: 1800
    2000: 7200
    5000: 21600
    10000: 86400
