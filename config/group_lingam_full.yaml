# Full paired comparison. Time limits are ceilings, not runtime predictions.
# Freeze this file before running; retain it with the outputs.
group_lingam_full:
  sizes: [100, 500, 1000, 2000, 5000, 10000]
  seeds: 10
  # GroupLiNGAM is fitted only for n <= this; ours runs on every size.
  # Serial fits: ~285 s at n=1000, ~28 min at n=2000; n=10000 would need ~1 day each.
  group_lingam_max_n:
    hard: 5000      # stable
    unstable: 5000
  # Concurrent single-threaded timed fits. 8 slots slowed GroupLiNGAM ~3.6x
  # (serial n=1000 seed 2: 278 s vs 996 s), so n <= 2000 ran serially;
  # the n=5000 extension runs 4 at a time.
  parallel_fits: 4
  concurrency_note: >-
    one timed fit at a time for n <= 2000; the n=5000 fits ran 4 at a time,
    so n=5000 GroupLiNGAM times are inflated by contention relative to the
    serial points.
  timeout_by_n:
    100: 600
    500: 600
    1000: 1800
    2000: 7200
    5000: 86400     # raised from 6 h before launch: ~4.5-7 h alone, slower 4 at a time
    10000: 86400
